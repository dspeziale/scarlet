manifest_version: 1
application: billing-worker
version: 1.0.0
runtime: docker
description: Billing batch worker with a Redis side-car (compose mode)

compose:
  file: docker-compose.yml
  project_name: billing-worker

environment:
  WORKER_CONCURRENCY: "2"

environment_files:
  - config/worker.env

healthcheck:
  type: container_status

deployment:
  strategy: recreate
  start_timeout: 120
  stop_timeout: 60
  restart_policy: unless-stopped

resources:
  cpu: "2"
  memory: 1Gi

rollback:
  enabled: true
  keep_releases: 3
