# Installed as /etc/systemd/system/podman.socket.d/10-pkm.conf by install.sh (only with --podman-access).
# Gives the "pkm" group access to the ROOTFUL Podman API socket.
# SECURITY: access to the rootful Podman socket is equivalent to root on this host.
# See SECURITY.md before enabling it; the alternative is a rootless socket of a dedicated user.
[Socket]
SocketGroup=pkm
SocketMode=0660
# /run/podman is created 0700 root:root: let other users traverse it (not list it) to reach the socket.
DirectoryMode=0711
ExecStartPost=/usr/bin/chmod 0711 /run/podman
