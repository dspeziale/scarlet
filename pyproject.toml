[project]
name = "scarlet"
version = "1.0.0"
description = "SCARLET - System Container Application Release, Lifecycle & Environment Tool"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements/base.txt"] }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "C4", "SIM", "PL"]
ignore = ["S101", "PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "B008", "S603", "S607", "S108", "N818", "PLW0603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PL", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = "migrations/versions"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "unit: fast isolated tests",
  "integration: tests that need DB/Redis-like infrastructure (SQLite/in-memory used)",
  "e2e: end-to-end workflow tests through the HTTP layer",
  "security: security regression tests",
]
