[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pkm"
dynamic = ["version"]
description = "Podman Kubernetes Manager - operations console for Kubernetes and Podman"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6,<7",
  "kubernetes>=30,<40",
  "httpx>=0.27,<1",
  "argon2-cffi>=23,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-timeout>=2", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
pkm-server = "pkm.cli:server_main"
pkm-admin = "pkm.cli:admin_main"

[tool.setuptools.dynamic]
version = { attr = "pkm.__version__" }

[tool.setuptools.packages.find]
include = ["pkm*"]

[tool.setuptools.package-data]
pkm = ["static/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration_k8s: requires a real Kubernetes cluster (PKM_IT_KUBECONFIG)",
  "integration_podman: requires a real Podman API (PKM_IT_PODMAN_URL)",
]
filterwarnings = [
  "ignore::DeprecationWarning:kubernetes.*",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
timeout = 300

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["E501", "RUF005", "RUF028", "S101", "S603", "S607", "B008", "RUF012", "S311", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"pkm/k8s/demo.py" = ["S"]
"pkm/podman/demo.py" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
