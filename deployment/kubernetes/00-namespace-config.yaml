# Optional: run SCARLET itself on Kubernetes. Primary supported method is Docker/Podman Compose.
# kubectl apply -f deployment/kubernetes/
apiVersion: v1
kind: Namespace
metadata:
  name: scarlet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scarlet-config
  namespace: scarlet
data:
  SCARLET_ENV: "production"
  SCARLET_LOG_LEVEL: "INFO"
  SCARLET_LOG_FORMAT: "json"
  SCARLET_ARTIFACT_PATH: "/data/scarlet/artifacts"
  SCARLET_UPLOAD_TMP_PATH: "/data/scarlet/uploads"
  SCARLET_LOG_PATH: "/data/scarlet/logs"
  SCARLET_SSH_HOST_KEY_POLICY: "strict"
  SCARLET_PROD_REQUIRE_CONFIRMATION: "true"
  SCARLET_MAX_UPLOAD_MB: "2048"
  SCARLET_TRUSTED_PROXIES: "1"
  SESSION_COOKIE_SECURE: "true"
  SCARLET_HSTS_ENABLED: "true"
  REDIS_URL: "redis://scarlet-redis:6379/0"
  GUNICORN_WORKERS: "4"
