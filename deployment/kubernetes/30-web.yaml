apiVersion: apps/v1
kind: Deployment
metadata:
  name: scarlet-web
  namespace: scarlet
  labels: { app: scarlet, component: web }
spec:
  replicas: 2
  selector: { matchLabels: { app: scarlet, component: web } }
  template:
    metadata: { labels: { app: scarlet, component: web } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: web
          image: registry.example.internal/scarlet:1.0.0
          args: ["web"]
          envFrom:
            - configMapRef: { name: scarlet-config }
            - secretRef: { name: scarlet-secrets }
          ports: [{ containerPort: 8000, name: http }]
          volumeMounts:
            - { name: data, mountPath: /data/scarlet }
            - { name: tmp, mountPath: /tmp }
          readinessProbe: { httpGet: { path: /api/ready, port: http }, initialDelaySeconds: 20, periodSeconds: 15 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 40, periodSeconds: 30 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: scarlet-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: scarlet-web
  namespace: scarlet
spec:
  selector: { app: scarlet, component: web }
  ports: [{ port: 80, targetPort: http, name: http }]
