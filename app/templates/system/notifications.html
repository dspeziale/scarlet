{% extends "layout/base.html" %}
{% block title %}Notifications{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item active">Notifications</li>{% endblock %}
{% block content %}
<div data-page="notifications">
<div class="card">
  <div class="card-header"><h3 class="card-title"><i class="fa-solid fa-bell me-2"></i>Notifications</h3><div class="card-tools"><button class="btn btn-sm btn-outline-secondary" id="btn-mark-all"><i class="fa-solid fa-check-double me-1"></i>Mark all read</button></div></div>
  <div class="card-body p-0"><ul class="list-group list-group-flush" id="notif-list"><li class="list-group-item text-muted">Loading…</li></ul></div>
</div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pages/system.js') }}"></script>{% endblock %}
