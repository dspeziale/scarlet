# Default values for the SCARLET Helm chart.
image:
  repository: registry.example.internal/scarlet
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Name of an existing Secret with SCARLET_SECRET_KEY, SCARLET_CREDENTIAL_ENCRYPTION_KEY,
# DATABASE_URL and SCARLET_INITIAL_ADMIN_PASSWORD. Never put secrets in values files.
existingSecret: scarlet-secrets

config:
  SCARLET_ENV: production
  SCARLET_LOG_LEVEL: INFO
  SCARLET_LOG_FORMAT: json
  SCARLET_SSH_HOST_KEY_POLICY: strict
  SCARLET_PROD_REQUIRE_CONFIRMATION: "true"
  SCARLET_MAX_UPLOAD_MB: "2048"
  SCARLET_TRUSTED_PROXIES: "1"
  SESSION_COOKIE_SECURE: "true"
  SCARLET_HSTS_ENABLED: "true"
  REDIS_URL: redis://scarlet-redis:6379/0
  GUNICORN_WORKERS: "4"

web:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi }

worker:
  replicas: 2
  concurrency: 4
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi }

beat:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteMany
  size: 50Gi
  existingClaim: ""

ingress:
  enabled: true
  className: nginx
  host: scarlet.example.internal
  tlsSecret: scarlet-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"

# Redis/PostgreSQL are expected to be provided externally (or by deployment/kubernetes/20-storage.yaml).
