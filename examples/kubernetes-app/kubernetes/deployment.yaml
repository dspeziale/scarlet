apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-web
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-web
    spec:
      containers:
        - name: web
          image: docker.io/library/nginx:1.27-alpine   # immutable per release: pin the tag
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: inventory-web-config
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
