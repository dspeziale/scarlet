# Nginx reverse proxy for SCARLET (development / plain HTTP behind an external TLS terminator).
# For production TLS use nginx-tls.conf.example.
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    client_max_body_size 2100m;          # must be >= SCARLET_MAX_UPLOAD_MB
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 10s;
    proxy_http_version 1.1;
    proxy_request_buffering off;         # stream uploads to gunicorn

    log_format scarlet '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" rid=$upstream_http_x_request_id rt=$request_time';
    access_log /var/log/nginx/access.log scarlet;
    error_log  /var/log/nginx/error.log warn;

    upstream scarlet_web {
        server scarlet-web:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location /static/ {
            proxy_pass http://scarlet_web;
            proxy_set_header Host $host;
            expires 1h;
            add_header Cache-Control "public";
        }

        location / {
            proxy_pass http://scarlet_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
        }
    }
}
