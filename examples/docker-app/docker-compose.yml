# Compose file executed on the target host with `docker compose` (or `podman compose`).
# SCARLET passes --env-file <shared/config/scarlet.env>; reference variables with ${VAR}.
services:
  worker:
    image: docker.io/library/busybox:1.36
    container_name: billing-worker
    command: ["sh", "-c", "while true; do echo billing-worker running; sleep 30; done"]
    restart: unless-stopped
    labels:
      scarlet.application: billing-worker
      scarlet.version: "${SCARLET_VERSION}"
    env_file:
      - ${SCARLET_SHARED_DIR}/config/scarlet.env
  cache:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
