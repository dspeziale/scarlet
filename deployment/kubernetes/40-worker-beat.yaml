apiVersion: apps/v1
kind: Deployment
metadata:
  name: scarlet-worker
  namespace: scarlet
  labels: { app: scarlet, component: worker }
spec:
  replicas: 2
  selector: { matchLabels: { app: scarlet, component: worker } }
  template:
    metadata: { labels: { app: scarlet, component: worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: worker
          image: registry.example.internal/scarlet:1.0.0
          args: ["worker"]
          env:
            - { name: SCARLET_SKIP_MIGRATIONS, value: "true" }
            - { name: CELERY_CONCURRENCY, value: "4" }
          envFrom:
            - configMapRef: { name: scarlet-config }
            - secretRef: { name: scarlet-secrets }
          volumeMounts:
            - { name: data, mountPath: /data/scarlet }
            - { name: tmp, mountPath: /tmp }
          livenessProbe:
            exec: { command: ["celery", "-A", "celery_worker.celery", "inspect", "ping", "-d", "celery@$(HOSTNAME)", "--timeout", "10"] }
            initialDelaySeconds: 60
            periodSeconds: 60
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: scarlet-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scarlet-beat
  namespace: scarlet
  labels: { app: scarlet, component: beat }
spec:
  replicas: 1                      # exactly one beat instance
  strategy: { type: Recreate }
  selector: { matchLabels: { app: scarlet, component: beat } }
  template:
    metadata: { labels: { app: scarlet, component: beat } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: beat
          image: registry.example.internal/scarlet:1.0.0
          args: ["beat"]
          envFrom:
            - configMapRef: { name: scarlet-config }
            - secretRef: { name: scarlet-secrets }
          volumeMounts:
            - { name: data, mountPath: /data/scarlet }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: scarlet-data }
        - name: tmp
          emptyDir: {}
