<!-- Generic confirmation modal driven by scarlet.js (Scarlet.confirm) -->
<div class="modal fade" id="confirm-modal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" id="confirm-modal-header">
        <h5 class="modal-title" id="confirm-modal-title">Confirm</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="confirm-modal-prod-banner" class="alert alert-danger d-none">
          <i class="fa-solid fa-triangle-exclamation me-2"></i><strong>PRODUCTION</strong> — this operation will modify a production system.
        </div>
        <div id="confirm-modal-body" class="mb-3"></div>
        <dl class="row small mb-3" id="confirm-modal-details"></dl>
        <div class="mb-3 d-none" id="confirm-modal-reason-group">
          <label class="form-label" for="confirm-modal-reason">Reason <span class="text-danger" id="confirm-modal-reason-required">*</span></label>
          <textarea class="form-control" id="confirm-modal-reason" rows="2" maxlength="2000" placeholder="Why is this operation being performed? (recorded in the audit log)"></textarea>
        </div>
        <div class="mb-1 d-none" id="confirm-modal-phrase-group">
          <label class="form-label" for="confirm-modal-phrase">Type <code id="confirm-modal-phrase-expected"></code> to confirm</label>
          <input type="text" class="form-control font-monospace" id="confirm-modal-phrase" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirm-modal-ok">Confirm</button>
      </div>
    </div>
  </div>
</div>

<!-- Operation progress modal (polls /api/operations/<id>) -->
<div class="modal fade" id="operation-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><span id="operation-modal-title">Operation</span> <span id="operation-modal-status" class="ms-2"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex align-items-center mb-2" id="operation-modal-spinner">
          <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
          <span class="text-muted small">Running on the target host… this page polls the job status every 2 seconds.</span>
        </div>
        <dl class="row small" id="operation-modal-meta"></dl>
        <div id="operation-modal-result"></div>
        <details class="mt-2"><summary class="small text-muted">Command log</summary><pre class="scarlet-log mt-2" id="operation-modal-log"></pre></details>
      </div>
      <div class="modal-footer">
        <a href="#" class="btn btn-outline-secondary btn-sm" id="operation-modal-link" target="_blank">Open operation</a>
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
