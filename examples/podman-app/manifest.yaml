# SCARLET release manifest — see docs/APPLICATION_RELEASE_CONTRACT.md
manifest_version: 1
application: customer-api
version: 1.0.0
runtime: podman
description: Customer master data REST API (example package)

image:
  name: docker.io/library/nginx        # replace with your registry image
  tag: 1.27-alpine                    # or leave empty and pass --version to the builder
  pull_policy: if-not-present

ports:
  - container: 80
    host: 8080
    protocol: tcp

environment:
  LOG_LEVEL: info
  APP_MODE: standard

environment_files:
  - config/app.env

secrets:                              # must be configured in SCARLET (Configuration -> SECRET)
  - DB_PASSWORD

volumes:
  - name: data
    mount: /var/lib/app/data
    shared: data
  - name: logs
    mount: /var/log/app
    shared: logs

healthcheck:
  type: http
  path: /
  port: 8080
  expected_status: 200
  timeout: 5
  retries: 5
  interval: 3

deployment:
  strategy: recreate
  start_timeout: 60
  stop_timeout: 30
  stop_grace_period: 10
  restart_policy: unless-stopped
  replicas: 1
  read_only_rootfs: false

resources:
  cpu: "1"
  memory: 512Mi

hooks:                                # only executed when the application has allow_hooks enabled
  pre_deploy:
    - scripts/pre-deploy.sh
  migrate:
    - scripts/migrate.sh
  post_deploy:
    - scripts/post-deploy.sh
  timeout: 300

dependencies:
  - name: postgres
    type: database
    required: true
    description: PostgreSQL 15+ reachable through DATABASE_URL

rollback:
  enabled: true
  keep_releases: 5

metadata:
  team: customer
  changelog: "Initial release"
