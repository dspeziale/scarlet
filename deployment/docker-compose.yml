# SCARLET production stack (Docker Compose / Podman Compose).
#   cp ../.env.example .env && edit secrets (flask scarlet gen-key), mount TLS certs into ./tls/
#   docker compose -f deployment/docker-compose.yml --env-file .env up -d
# Differences from the development stack: SCARLET_ENV=production, TLS-terminating nginx,
# strict SSH host key policy, no mock host, resource limits, read-only root filesystems.

x-scarlet-common: &scarlet-common
  image: ${SCARLET_IMAGE:-scarlet:1.0.0}
  env_file: .env
  environment:
    SCARLET_ENV: production
    DATABASE_URL: postgresql://scarlet:${POSTGRES_PASSWORD}@postgres:5432/scarlet
    REDIS_URL: redis://redis:6379/0
    SCARLET_ARTIFACT_PATH: /data/scarlet/artifacts
    SCARLET_UPLOAD_TMP_PATH: /data/scarlet/uploads
    SCARLET_LOG_PATH: /data/scarlet/logs
    SCARLET_SSH_HOST_KEY_POLICY: strict
    SESSION_COOKIE_SECURE: "true"
    SCARLET_HSTS_ENABLED: "true"
    SCARLET_TRUSTED_PROXIES: "1"
  volumes:
    - scarlet-data:/data/scarlet
    - scarlet-tmp:/tmp
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: always
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: scarlet
      POSTGRES_USER: scarlet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scarlet -d scarlet"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always
    deploy: { resources: { limits: { memory: 1g } } }

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  scarlet-web:
    <<: *scarlet-common
    command: ["web"]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    deploy: { resources: { limits: { memory: 1g, cpus: "2" } } }

  scarlet-worker:
    <<: *scarlet-common
    command: ["worker"]
    depends_on:
      scarlet-web: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 1g, cpus: "2" } } }

  scarlet-beat:
    <<: *scarlet-common
    command: ["beat"]
    depends_on:
      scarlet-web: { condition: service_healthy }

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-tls.conf:/etc/nginx/nginx.conf:ro      # copy docker/nginx-tls.conf.example and set server_name
      - ./tls:/etc/nginx/tls:ro                         # scarlet.crt + scarlet.key from your CA
      - nginx-logs:/var/log/nginx
    depends_on:
      scarlet-web: { condition: service_healthy }
    restart: always

volumes:
  postgres-data:
  redis-data:
  scarlet-data:
  scarlet-tmp:
  nginx-logs:
