# Scarlet - configuration file
# Installed as /etc/pkm/config.yaml (owner root:pkm, mode 0640).
# Every key can be overridden by an environment variable PKM_<SECTION>__<KEY>
# (e.g. PKM_SERVER__PORT=8443), normally placed in /etc/pkm/pkm.env.
# Keys marked [UI] can also be changed later from Impostazioni (stored in the database).

app_name: "Scarlet"

# live = real cluster. demo = simulated data, only allowed with environment: development.
mode: live
environment: production

server:
  host: 0.0.0.0                 # bind address (use 127.0.0.1 behind a local reverse proxy)
  port: 8443
  tls_cert: /etc/pkm/tls/pkm.crt   # PEM certificate (chain); comment both lines to serve plain HTTP
  tls_key: /etc/pkm/tls/pkm.key    # PEM private key, readable only by root:pkm (0640)
  trusted_proxies: []           # e.g. ["127.0.0.1"] when nginx/haproxy terminates TLS in front of Scarlet
  graceful_shutdown_seconds: 20

kubernetes:                     # [UI]
  enabled: true
  kubeconfig: /etc/pkm/kubeconfig   # kubeconfig of the dedicated "pkm" ServiceAccount
  context: null                 # null = current-context of the kubeconfig
  in_cluster: false             # true only when Scarlet itself runs inside the cluster
  connect_timeout: 5
  request_timeout: 20
  cache_ttl_seconds: 3          # short cache of list calls; 0 disables it

podman:                         # [UI]
  enabled: true
  url: unix:///run/podman/podman.sock   # rootful socket (podman.socket); rootless: unix:///run/user/<uid>/podman/podman.sock
  timeout: 10

database:
  path: /var/lib/pkm/pkm.db

auth:                           # [UI]
  session_idle_minutes: 30
  session_absolute_hours: 12
  login_max_attempts: 5
  lockout_minutes: 15
  password_min_length: 12
  cookie_secure: null           # null = automatic (Secure when TLS or a trusted proxy is configured)

logging:
  level: INFO                   # [UI] DEBUG | INFO | WARNING | ERROR
  file: /var/log/pkm/pkm.log    # JSON lines; rotated by RotatingFileHandler and /etc/logrotate.d/pkm
  max_bytes: 10485760
  backup_count: 5
  json_format: true

monitoring:                     # [UI]
  poll_interval_seconds: 30     # problem detection / notifications refresh
  metrics_server: true
  prometheus_url: null          # e.g. http://prometheus.monitoring.svc:9090 (optional)
  prometheus_timeout: 10
  prometheus_verify_tls: true
  # prometheus_token: set PKM_MONITORING__PROMETHEUS_TOKEN in /etc/pkm/pkm.env instead

backup:                         # [UI]
  directory: /var/lib/pkm/backups
  retention_count: 14
  include_manifests: false      # also export Kubernetes manifests (no Secrets, no volume data)

audit:
  retention_days: 365           # [UI]

logs:                           # [UI] limits of the log viewer
  max_tail_lines: 5000
  stream_max_seconds: 1800
  stream_max_lines: 20000
  max_concurrent_streams: 20

rate_limit:
  api_per_minute: 600
  login_per_minute: 10
