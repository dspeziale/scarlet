# Example Ingress (nginx ingress controller). TLS certificate must be provided as a secret
# (cert-manager, or `kubectl create secret tls scarlet-tls --cert=... --key=...`).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scarlet
  namespace: scarlet
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [scarlet.example.internal]
      secretName: scarlet-tls
  rules:
    - host: scarlet.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scarlet-web
                port: { name: http }
