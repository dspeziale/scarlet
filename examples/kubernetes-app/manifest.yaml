manifest_version: 1
application: inventory-web
version: 1.0.0
runtime: kubernetes
description: Inventory web front-end deployed as a Kubernetes Deployment + Service

kubernetes:
  namespace: inventory
  manifests: kubernetes
  deployment_name: inventory-web
  container_name: web
  service:
    type: ClusterIP
    port: 80
    target_port: 8080

healthcheck:
  type: kubernetes_status
  timeout: 10
  retries: 10
  interval: 6

deployment:
  strategy: rolling
  start_timeout: 180
  replicas: 2

resources:
  cpu: 500m
  memory: 256Mi

rollback:
  enabled: true
  keep_releases: 5
