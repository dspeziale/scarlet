# SCARLET development stack: `docker compose up -d` (or `podman compose up -d`).
# Services: postgres, redis, scarlet-web, scarlet-worker, scarlet-beat, nginx, mockhost (simulated Oracle Linux + Podman).
# Copy .env.example to .env first. UI: http://localhost:8080  (admin / SCARLET_INITIAL_ADMIN_PASSWORD)

x-scarlet-common: &scarlet-common
  image: scarlet:latest
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: .env
  environment:
    SCARLET_ENV: ${SCARLET_ENV:-development}
    DATABASE_URL: postgresql://scarlet:${POSTGRES_PASSWORD:-scarlet}@postgres:5432/scarlet
    REDIS_URL: redis://redis:6379/0
    SCARLET_ARTIFACT_PATH: /data/scarlet/artifacts
    SCARLET_UPLOAD_TMP_PATH: /data/scarlet/uploads
    SCARLET_LOG_PATH: /data/scarlet/logs
    SCARLET_SSH_HOST_KEY_POLICY: ${SCARLET_SSH_HOST_KEY_POLICY:-tofu}
    SCARLET_ASSET_MODE: ${SCARLET_ASSET_MODE:-cdn}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    SCARLET_HSTS_ENABLED: "false"
  volumes:
    - scarlet-data:/data/scarlet
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: scarlet
      POSTGRES_USER: scarlet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scarlet}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scarlet -d scarlet"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  scarlet-web:
    <<: *scarlet-common
    command: ["web"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  scarlet-worker:
    <<: *scarlet-common
    command: ["worker"]
    environment:
      SCARLET_ENV: ${SCARLET_ENV:-development}
      DATABASE_URL: postgresql://scarlet:${POSTGRES_PASSWORD:-scarlet}@postgres:5432/scarlet
      REDIS_URL: redis://redis:6379/0
      SCARLET_SSH_HOST_KEY_POLICY: ${SCARLET_SSH_HOST_KEY_POLICY:-tofu}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
    depends_on:
      scarlet-web:
        condition: service_healthy

  scarlet-beat:
    <<: *scarlet-common
    command: ["beat"]
    depends_on:
      scarlet-web:
        condition: service_healthy

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "${SCARLET_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      scarlet-web:
        condition: service_healthy
    restart: unless-stopped

  # Simulated Oracle Linux target with SSH + Podman. Register it in SCARLET as:
  #   hostname: mockhost   port: 22   user: scarlet   runtime: PODMAN   credential: password "scarlet-dev"
  mockhost:
    build:
      context: docker/mockhost
    hostname: mockhost
    privileged: true            # required for Podman-in-container in the dev sandbox only
    environment:
      MOCKHOST_USER: scarlet
      MOCKHOST_PASSWORD: ${MOCKHOST_PASSWORD:-scarlet-dev}
    ports:
      - "${MOCKHOST_SSH_PORT:-2222}:22"
    volumes:
      - mockhost-data:/opt/scarlet
      - mockhost-containers:/home/scarlet/.local/share/containers
    restart: unless-stopped
    profiles: ["dev"]

volumes:
  postgres-data:
  redis-data:
  scarlet-data:
  nginx-logs:
  mockhost-data:
  mockhost-containers:
