# EXAMPLE ONLY - do not commit real values. Create the real secret with:
#   kubectl -n scarlet create secret generic scarlet-secrets \
#     --from-literal=SCARLET_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" \
#     --from-literal=SCARLET_CREDENTIAL_ENCRYPTION_KEY="$(flask scarlet gen-key)" \
#     --from-literal=DATABASE_URL="postgresql://scarlet:<password>@scarlet-postgres:5432/scarlet" \
#     --from-literal=SCARLET_INITIAL_ADMIN_PASSWORD="<initial admin password>"
apiVersion: v1
kind: Secret
metadata:
  name: scarlet-secrets
  namespace: scarlet
type: Opaque
stringData:
  SCARLET_SECRET_KEY: "REPLACE-ME-random-48-chars-minimum-................."
  SCARLET_CREDENTIAL_ENCRYPTION_KEY: "REPLACE-ME-output-of-flask-scarlet-gen-key=="
  DATABASE_URL: "postgresql://scarlet:REPLACE-ME@scarlet-postgres:5432/scarlet"
  SCARLET_INITIAL_ADMIN_PASSWORD: "REPLACE-ME-Str0ng-Initial-Passw0rd!"
